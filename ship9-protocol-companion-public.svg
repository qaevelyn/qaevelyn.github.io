  <polygon points="224,166 232,170 224,174" fill="#8b6f3d"/>
  <text x="210" y="160" text-anchor="middle" font-size="8" fill="#8b6f3d">terms out</text>
  <line x1="416" y1="170" x2="444" y2="170" stroke="#8b6f3d" stroke-width="2"/>
  <polygon points="444,166 452,170 444,174" fill="#8b6f3d"/>
  <text x="430" y="160" text-anchor="middle" font-size="8" fill="#8b6f3d">contact in</text>
  <line x1="416" y1="220" x2="444" y2="220" stroke="#a33" stroke-width="2"/>
  <line x1="436" y1="214" x2="444" y2="220" stroke="#a33" stroke-width="2"/>
  <line x1="436" y1="226" x2="444" y2="220" stroke="#a33" stroke-width="2"/>
  <text x="430" y="240" text-anchor="middle" font-size="8" fill="#a33">interior: never</text>
  <!-- footer -->
  <text x="320" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">A Mirror of My Becoming™ · Ship 9 · © 2026 Evelyn Caro — commercial license only, review under NDA</text>
