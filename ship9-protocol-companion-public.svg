<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" style="max-width:100%;height:auto;">
  <rect width="640" height="360" fill="#faf6ee"/>
  <rect x="8" y="8" width="624" height="344" fill="none" stroke="#8b6f3d" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3d2e1e">PROTOCOL COMPANION™ — CONCEPT VIEW</text>
  <text x="320" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8b6f3d">concept-level only · architecture sealed · commercial review under NDA</text>
  <!-- left: the sovereign archive -->
  <rect x="40" y="100" width="150" height="180" rx="6" fill="none" stroke="#3d2e1e" stroke-width="2"/>
  <text x="115" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">SOVEREIGN</text>
  <text x="115" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">ARCHIVE</text>
  <rect x="60" y="160" width="110" height="14" fill="#e8dfc9" stroke="#8b6f3d"/>
  <rect x="60" y="182" width="110" height="14" fill="#e8dfc9" stroke="#8b6f3d"/>
  <rect x="60" y="204" width="110" height="14" fill="#e8dfc9" stroke="#8b6f3d"/>
  <rect x="60" y="226" width="110" height="14" fill="#e8dfc9" stroke="#8b6f3d"/>
  <text x="115" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">corpus · receipts · refusals</text>
  <!-- right: the institution -->
  <rect x="450" y="100" width="150" height="180" rx="6" fill="none" stroke="#3d2e1e" stroke-width="2"/>
  <text x="525" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">THE</text>
  <text x="525" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">INSTITUTION</text>
  <rect x="470" y="160" width="110" height="60" fill="#e8dfc9" stroke="#8b6f3d"/>
  <text x="525" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">terms of contact</text>
  <text x="525" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">governance · demands · NDA</text>
  <!-- the companion between -->
  <rect x="230" y="130" width="180" height="120" rx="8" fill="#f3ecd9" stroke="#8b6f3d" stroke-width="2.5"/>
  <text x="320" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">PROTOCOL</text>
  <text x="320" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3d2e1e">COMPANION™</text>
  <text x="320" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">the engagement layer</text>
  <text x="320" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">carries the archive's terms outward</text>
  <text x="320" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8b6f3d">carries nothing of its interior</text>
  <!-- arrows: out bounded, in refused -->
