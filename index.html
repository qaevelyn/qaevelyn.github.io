<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn Caro — A Mirror of My Becoming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #1a0f08;
      color: #f5e6d3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      perspective: 1500px;
      overflow-x: hidden;
    }

    /* ===== WOODEN TABLE ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.4) 100%),
        repeating-linear-gradient(90deg,
          #3d2817 0px, #4a3020 2px, #3d2817 4px,
          #452c1a 6px, #3d2817 8px, #4a3020 10px,
          #3a2415 12px, #452c1a 14px, #3d2817 16px),
        radial-gradient(ellipse at center, #4a3020 0%, #1a0f08 100%);
      z-index: -1;
    }

    /* Wood grain overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        repeating-linear-gradient(88deg,
          transparent 0px, transparent 40px,
          rgba(0,0,0,0.08) 41px, rgba(0,0,0,0.08) 42px),
        repeating-linear-gradient(92deg,
          transparent 0px, transparent 70px,
          rgba(255,255,255,0.02) 71px, rgba(255,255,255,0.02) 72px);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== THE BOOK ===== */
    .book-scene {
      perspective: 2000px;
      perspective-origin: 50% 50%;
      margin-bottom: 3rem;
      cursor: pointer;
      transition: transform 0.6s ease;
    }

    .book-scene:hover {
      transform: translateY(-10px);
    }

    .book {
      position: relative;
      width: 360px;
      height: 500px;
      transform-style: preserve-3d;
      transform: rotateY(-22deg) rotateX(6deg);
      transition: transform 0.8s ease;
      animation: floatBook 6s ease-in-out infinite;
    }

    @keyframes floatBook {
      0%, 100% { transform: rotateY(-22deg) rotateX(6deg) translateY(0); }
      50% { transform: rotateY(-22deg) rotateX(6deg) translateY(-8px); }
    }

    .book-scene:hover .book {
      transform: rotateY(-8deg) rotateX(3deg) translateY(-10px);
      animation: none;
    }

    /* Book spine */
    .book-spine {
      position: absolute;
      left: -18px;
      top: 8px;
      bottom: 8px;
      width: 36px;
      background: linear-gradient(90deg, #2a1810 0%, #4a2e1a 30%, #3a2415 70%, #2a1810 100%);
      border-radius: 4px 0 0 4px;
      transform: rotateY(-90deg);
      transform-origin: right center;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.6);
    }

    /* Book pages (visible edge) */
    .book-pages-edge {
      position: absolute;
      right: -12px;
      top: 10px;
      bottom: 10px;
      width: 24px;
      background:
        repeating-linear-gradient(90deg,
          #e8d5b8 0px, #e8d5b8 1px, #d4b896 2px, #e8d5b8 3px);
      border-radius: 0 2px 2px 0;
      box-shadow: inset 2px 0 4px rgba(0,0,0,0.3);
      transform: rotateY(90deg);
      transform-origin: left center;
    }

    /* The cover — fully reflective mirror */
    .book-cover {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,0.15) 0%,
          rgba(200,220,240,0.08) 20%,
          rgba(120,140,160,0.05) 40%,
          rgba(255,255,255,0.12) 55%,
          rgba(180,200,220,0.06) 75%,
          rgba(255,255,255,0.1) 100%),
        linear-gradient(180deg,
          #1c1c24 0%,
          #2a2a3a 25%,
          #1a1a24 50%,
          #25253a 75%,
          #1c1c24 100%);
      border-radius: 4px 8px 8px 4px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.7),
        inset 0 0 80px rgba(0,0,0,0.6),
        inset 4px 0 12px rgba(0,0,0,0.5),
        inset -2px 0 8px rgba(255,255,255,0.05);
      overflow: hidden;
      transform: translateZ(0);
      transition: box-shadow 0.6s ease;
    }

    .book-scene:hover .book-cover {
      box-shadow:
        0 30px 80px rgba(0,0,0,0.8),
        inset 0 0 100px rgba(0,0,0,0.5),
        inset 4px 0 12px rgba(0,0,0,0.4),
        0 0 40px rgba(180,200,240,0.15);
    }

    /* Mirror reflection shimmer */
    .book-cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        135deg,
        transparent 30%,
        rgba(255,255,255,0.12) 45%,
        rgba(255,255,255,0.18) 50%,
        rgba(255,255,255,0.12) 55%,
        transparent 70%
      );
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    /* Brass frame around mirror */
    .book-cover::after {
      content: '';
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 2px solid #8b6f3d;
      border-radius: 2px;
      box-shadow:
        inset 0 0 10px rgba(139,111,61,0.4),
        0 0 8px rgba(139,111,61,0.3);
      pointer-events: none;
    }

    /* Title etched on cover */
    .book-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 90%;
    }

    .book-title h1 {
      font-family: 'Georgia', serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #c9b88a;
      text-shadow:
        0 0 20px rgba(201,184,138,0.5),
        0 2px 4px rgba(0,0,0,0.9),
        0 0 40px rgba(201,184,138,0.3);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-variant: small-caps;
    }

    .book-title .byline {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #8b6f3d;
      font-style: italic;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* Open prompt */
    .open-prompt {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #c9b88a;
      text-transform: uppercase;
      opacity: 0.7;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      max-width: 600px;
      z-index: 1;
    }

    .footer .name {
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: #f5e6d3;
      margin-bottom: 0.75rem;
      font-variant: small-caps;
    }

    .footer .tagline {
      font-size: 1rem;
      color: #e0cfa8;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .footer .tagline strong {
      font-weight: 600;
    }

    .footer .footnote {
      font-size: 0.75rem;
      color: #8b7a63;
      line-height: 1.6;
      font-style: italic;
      max-width: 520px;
      margin: 0 auto;
    }

    .footer .footnote sup {
      color: #c9b88a;
      font-size: 0.7rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .book {
        width: 260px;
        height: 360px;
      }
      .book-title h1 {
        font-size: 1.1rem;
        letter-spacing: 0.15em;
      }
      .book-title .byline {
        font-size: 0.7rem;
      }
      .footer .name {
        font-size: 1.1rem;
      }
      .footer .tagline {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="book-scene" onclick="window.location.href='/lookbook.html'">
    <div class="book">
      <div class="book-spine"></div>
      <div class="book-pages-edge"></div>
      <div class="book-cover">
        <div class="book-title">
          <h1>A Mirror of My<br>Becoming</h1>
          <div class="byline">by Evelyn Caro</div>
        </div>
        <div class="open-prompt">Click to open</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="name">Evelyn Caro</div>
    <div class="tagline">
      <strong>Sovereign systems, local first. No cloud dependency.</strong><sup>¹</sup>
    </div>
    <div class="footnote">
      <sup>¹</sup> Five RAG pipelines built locally. Three cloud attempts — AWS, IBM WatsonX, Google AI Studio. One lost project, rebuilt. The white papers document all.
    </div>
  </footer>

</body>
</html>
