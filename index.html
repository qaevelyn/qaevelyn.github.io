<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn Caro — A Mirror of My Becoming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #1a0f08;
      color: #f5e6d3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      perspective: 1500px;
      overflow-x: hidden;
    }

    /* ===== WOODEN TABLE — richer grain ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(140,80,40,0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(50,25,10,0.6) 0%, transparent 60%),
        repeating-linear-gradient(88deg,
          #3a2214 0px, #442a18 4px, #3a2214 8px,
          #4a2e1c 12px, #3a2214 16px, #422818 20px,
          #3a2214 24px, #452a18 28px, #3a2214 32px),
        repeating-linear-gradient(92deg,
          transparent 0px, transparent 60px,
          rgba(0,0,0,0.1) 61px, rgba(0,0,0,0.1) 62px),
        linear-gradient(180deg, #4a2e1c 0%, #2a1810 50%, #1a0f08 100%);
      z-index: -1;
    }

    /* Wood grain overlay — knots and variation */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 15% 30%, rgba(80,45,20,0.4) 0%, transparent 8%),
        radial-gradient(circle at 85% 65%, rgba(80,45,20,0.3) 0%, transparent 6%),
        radial-gradient(circle at 45% 85%, rgba(80,45,20,0.35) 0%, transparent 5%),
        repeating-linear-gradient(87deg,
          transparent 0px, transparent 30px,
          rgba(0,0,0,0.06) 31px, rgba(0,0,0,0.06) 32px),
        repeating-linear-gradient(89deg,
          transparent 0px, transparent 80px,
          rgba(255,255,255,0.015) 81px, rgba(255,255,255,0.015) 82px);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== THE BOOK — ENCYCLOPEDIA THICKNESS ===== */
    .book-scene {
      perspective: 2200px;
      perspective-origin: 50% 50%;
      margin-bottom: 3rem;
      cursor: pointer;
      transition: transform 0.6s ease;
    }

    .book-scene:hover {
      transform: translateY(-10px);
    }

    .book {
      position: relative;
      width: 380px;
      height: 540px;
      transform-style: preserve-3d;
      transform: rotateY(-22deg) rotateX(6deg);
      transition: transform 0.8s ease;
      animation: floatBook 6s ease-in-out infinite;
    }

    @keyframes floatBook {
      0%, 100% { transform: rotateY(-22deg) rotateX(6deg) translateY(0); }
      50% { transform: rotateY(-22deg) rotateX(6deg) translateY(-8px); }
    }

    .book-scene:hover .book {
      transform: rotateY(-8deg) rotateX(3deg) translateY(-10px);
      animation: none;
    }

    /* Thick leather spine */
    .book-spine {
      position: absolute;
      left: -32px;
      top: 10px;
      bottom: 10px;
      width: 64px;
      background: linear-gradient(90deg,
        #1a0f08 0%,
        #2a1810 15%,
        #4a2e1a 35%,
        #3a2415 55%,
        #4a2e1a 75%,
        #2a1810 90%,
        #1a0f08 100%);
      border-radius: 6px 0 0 6px;
      transform: rotateY(-90deg);
      transform-origin: right center;
      box-shadow:
        inset -3px 0 6px rgba(0,0,0,0.7),
        inset 3px 0 6px rgba(255,255,255,0.05);
    }

    /* Spine ridges (raised bands) */
    .book-spine::before,
    .book-spine::after {
      content: '';
      position: absolute;
      left: 4px;
      right: 4px;
      height: 4px;
      background: linear-gradient(180deg, #5a3a1a 0%, #2a1810 100%);
      border-radius: 2px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .book-spine::before {
      top: 80px;
    }

    .book-spine::after {
      bottom: 80px;
    }

    /* Thick page block edge */
    .book-pages-edge {
      position: absolute;
      right: -24px;
      top: 12px;
      bottom: 12px;
      width: 48px;
      background:
        repeating-linear-gradient(90deg,
          #e8d5b8 0px, #e8d5b8 2px, #c9b08a 3px, #d4b896 4px, #e8d5b8 5px, #dcc8a0 6px),
        linear-gradient(180deg, #f0e0c8 0%, #e8d5b8 50%, #d4b896 100%);
      border-radius: 0 3px 3px 0;
      box-shadow:
        inset 3px 0 6px rgba(0,0,0,0.25),
        inset -2px 0 4px rgba(0,0,0,0.15);
      transform: rotateY(90deg);
      transform-origin: left center;
    }

    /* Page stack texture (individual pages) */
    .book-pages-edge::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        repeating-linear-gradient(90deg,
          transparent 0px, transparent 3px,
          rgba(0,0,0,0.12) 4px, rgba(0,0,0,0.12) 5px);
    }

    /* The cover — leather with mirror panel */
    .book-cover {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,0.12) 0%,
          rgba(200,220,240,0.06) 20%,
          rgba(120,140,160,0.03) 40%,
          rgba(255,255,255,0.1) 55%,
          rgba(180,200,220,0.05) 75%,
          rgba(255,255,255,0.08) 100%),
        linear-gradient(180deg,
          #1c1c24 0%,
          #2a2a3a 25%,
          #1a1a24 50%,
          #25253a 75%,
          #1c1c24 100%);
      border-radius: 6px 10px 10px 6px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.75),
        0 10px 30px rgba(0,0,0,0.5),
        inset 0 0 100px rgba(0,0,0,0.6),
        inset 6px 0 16px rgba(0,0,0,0.55),
        inset -3px 0 10px rgba(255,255,255,0.04);
      overflow: hidden;
      transform: translateZ(0);
      transition: box-shadow 0.6s ease;
    }

    .book-scene:hover .book-cover {
      box-shadow:
        0 40px 100px rgba(0,0,0,0.85),
        0 15px 40px rgba(0,0,0,0.6),
        inset 0 0 120px rgba(0,0,0,0.5),
        inset 6px 0 16px rgba(0,0,0,0.45),
        0 0 50px rgba(180,200,240,0.18);
    }

    /* Mirror shimmer */
    .book-cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        135deg,
        transparent 30%,
        rgba(255,255,255,0.12) 45%,
        rgba(255,255,255,0.18) 50%,
        rgba(255,255,255,0.12) 55%,
        transparent 70%
      );
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    /* Brass frame */
    .book-cover::after {
      content: '';
      position: absolute;
      top: 16px; left: 16px; right: 16px; bottom: 16px;
      border: 3px solid #8b6f3d;
      border-radius: 3px;
      box-shadow:
        inset 0 0 12px rgba(139,111,61,0.5),
        0 0 10px rgba(139,111,61,0.35),
        0 0 0 1px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .book-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 90%;
    }

    .book-title h1 {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #c9b88a;
      text-shadow:
        0 0 20px rgba(201,184,138,0.5),
        0 2px 4px rgba(0,0,0,0.9),
        0 0 40px rgba(201,184,138,0.3);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-variant: small-caps;
    }

    .open-prompt {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #c9b88a;
      text-transform: uppercase;
      opacity: 0.7;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .footer {
      text-align: center;
      max-width: 600px;
      z-index: 1;
    }

    .footer .name {
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: #f5e6d3;
      margin-bottom: 0.75rem;
      font-variant: small-caps;
    }

    .footer .tagline {
      font-size: 1rem;
      color: #e0cfa8;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .footer .tagline strong {
      font-weight: 600;
    }

    .footer .footnote {
      font-size: 0.75rem;
      color: #8b7a63;
      line-height: 1.6;
      font-style: italic;
      max-width: 520px;
      margin: 0 auto;
    }

    .footer .footnote sup {
      color: #c9b88a;
      font-size: 0.7rem;
    }

    @media (max-width: 600px) {
      .book {
        width: 280px;
        height: 400px;
      }
      .book-spine {
        left: -22px;
        width: 44px;
      }
      .book-pages-edge {
        right: -18px;
        width: 36px;
      }
      .book-title h1 {
        font-size: 1.1rem;
        letter-spacing: 0.15em;
      }
      .footer .name {
        font-size: 1.1rem;
      }
      .footer .tagline {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="book-scene" onclick="window.location.href='/lookbook.html'">
    <div class="book">
      <div class="book-spine"></div>
      <div class="book-pages-edge"></div>
      <div class="book-cover">
        <div class="book-title">
          <h1>A Mirror of My<br>Becoming</h1>
        </div>
        <div class="open-prompt">Click to open</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="name">Evelyn Caro</div>
    <div class="tagline">
      <strong>Sovereign systems, local first. No cloud dependency.</strong><sup>¹</sup>
    </div>
    <div class="footnote">
      <sup>¹</sup> Five RAG pipelines built locally. Three cloud attempts — AWS, IBM WatsonX, Google AI Studio. One lost project, rebuilt. The white papers document all.
    </div>
  </footer>

</body>
</html>
