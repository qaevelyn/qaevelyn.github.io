<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn Caro — A Mirror of My Becoming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #1a0f08;
      color: #f5e6d3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      perspective: 2400px;
      perspective-origin: 50% 45%;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(140,80,40,0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(50,25,10,0.6) 0%, transparent 60%),
        repeating-linear-gradient(88deg,
          #3a2214 0px, #442a18 4px, #3a2214 8px,
          #4a2e1c 12px, #3a2214 16px, #422818 20px,
          #3a2214 24px, #452a18 28px, #3a2214 32px),
        repeating-linear-gradient(92deg,
          transparent 0px, transparent 60px,
          rgba(0,0,0,0.1) 61px, rgba(0,0,0,0.1) 62px),
        linear-gradient(180deg, #4a2e1c 0%, #2a1810 50%, #1a0f08 100%);
      z-index: -1;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 15% 30%, rgba(80,45,20,0.4) 0%, transparent 8%),
        radial-gradient(circle at 85% 65%, rgba(80,45,20,0.3) 0%, transparent 6%),
        radial-gradient(circle at 45% 85%, rgba(80,45,20,0.35) 0%, transparent 5%);
      pointer-events: none;
      z-index: -1;
    }

    .book-scene {
      perspective: 2400px;
      perspective-origin: 50% 45%;
      margin-bottom: 3rem;
      cursor: pointer;
    }

    .book {
      position: relative;
      width: 380px;
      height: 540px;
      transform-style: preserve-3d;
      transform: rotateY(-28deg) rotateX(4deg);
      animation: floatBook 6s ease-in-out infinite;
    }

    @keyframes floatBook {
      0%, 100% { transform: rotateY(-28deg) rotateX(4deg) translateY(0); }
      50% { transform: rotateY(-28deg) rotateX(4deg) translateY(-8px); }
    }

    .book-scene:hover .book {
      transform: rotateY(-18deg) rotateX(2deg) translateY(-10px);
      animation: none;
    }

    /* ===== SPINE ===== */
    .book-spine {
      position: absolute;
      top: 0;
      left: -90px;
      width: 90px;
      height: 540px;
      background: linear-gradient(90deg,
        #2a1a0e 0%, #3a2414 20%, #4a3018 45%, #3a2414 70%, #2a1a0e 100%);
      transform-origin: right center;
      transform: rotateY(-90deg);
      box-shadow:
        inset 0 0 30px rgba(0,0,0,0.5),
        inset -4px 0 8px rgba(0,0,0,0.4),
        inset 4px 0 8px rgba(255,255,255,0.05);
    }

    .book-spine .band {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 4px;
      background: linear-gradient(180deg,
        #f0d878 0%, #d4b670 25%, #a88a45 50%, #8b6f3d 75%, #6a5428 100%);
      border-radius: 2px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .book-spine .band.b1 { top: 60px; }
    .book-spine .band.b2 { top: 165px; }
    .book-spine .band.b3 { top: 270px; }
    .book-spine .band.b4 { top: 375px; }
    .book-spine .band.b5 { bottom: 60px; }

    .book-spine .spine-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      color: #d4b670;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-variant: small-caps;
      white-space: nowrap;
      text-shadow:
        0 0 6px rgba(212,182,112,0.6),
        0 1px 2px rgba(0,0,0,0.9);
    }

    /* ===== FORE-EDGE WITH GILDING ===== */
    .book-fore-edge {
      position: absolute;
      top: 0;
      right: -90px;
      width: 90px;
      height: 540px;
      background:
        linear-gradient(180deg,
          #d4b670 0%, #d4b670 3px,
          #f0d878 3px, #a88a45 6px,
          transparent 6px, transparent 12px,
          transparent 12px, transparent calc(100% - 12px),
          transparent calc(100% - 12px), transparent calc(100% - 6px),
          #a88a45 calc(100% - 6px), #f0d878 calc(100% - 3px),
          #d4b670 calc(100% - 3px), #d4b670 100%),
        repeating-linear-gradient(90deg,
          #e8d5b8 0px, #e8d5b8 1px, #c9b08a 2px, #d4b896 3px,
          #e8d5b8 4px, #dcc8a0 5px),
        linear-gradient(180deg, #f0e0c8 0%, #e8d5b8 50%, #d4b896 100%);
      transform-origin: left center;
      transform: rotateY(90deg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }

    /* ===== TOP EDGE WITH GILDING ===== */
    .book-top-edge {
      position: absolute;
      top: -90px;
      left: 0;
      width: 380px;
      height: 90px;
      background:
        linear-gradient(90deg,
          #d4b670 0%, #d4b670 3px,
          #f0d878 3px, #a88a45 6px,
          transparent 6px, transparent 12px,
          transparent 12px, transparent calc(100% - 12px),
          transparent calc(100% - 12px), transparent calc(100% - 6px),
          #a88a45 calc(100% - 6px), #f0d878 calc(100% - 3px),
          #d4b670 calc(100% - 3px), #d4b670 100%),
        repeating-linear-gradient(0deg,
          #e8d5b8 0px, #e8d5b8 1px, #c9b08a 2px, #d4b896 3px,
          #e8d5b8 4px, #dcc8a0 5px),
        linear-gradient(90deg, #d4b896 0%, #e8d5b8 50%, #d4b896 100%);
      transform-origin: bottom center;
      transform: rotateX(90deg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
    }

    /* ===== BOTTOM EDGE WITH GILDING ===== */
    .book-bottom-edge {
      position: absolute;
      bottom: -90px;
      left: 0;
      width: 380px;
      height: 90px;
      background:
        linear-gradient(90deg,
          #d4b670 0%, #d4b670 3px,
          #f0d878 3px, #a88a45 6px,
          transparent 6px, transparent 12px,
          transparent 12px, transparent calc(100% - 12px),
          transparent calc(100% - 12px), transparent calc(100% - 6px),
          #a88a45 calc(100% - 6px), #f0d878 calc(100% - 3px),
          #d4b670 calc(100% - 3px), #d4b670 100%),
        repeating-linear-gradient(0deg,
          #e8d5b8 0px, #e8d5b8 1px, #c9b08a 2px, #d4b896 3px,
          #e8d5b8 4px, #dcc8a0 5px),
        linear-gradient(90deg, #d4b896 0%, #e8d5b8 50%, #d4b896 100%);
      transform-origin: top center;
      transform: rotateX(-90deg);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
    }

    /* ===== FRONT COVER WITH LEATHER GRAIN ===== */
    .book-front {
      position: absolute;
      top: 0; left: 0;
      width: 380px;
      height: 540px;
      background:
        radial-gradient(circle at 20% 30%, rgba(80,80,100,0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(60,60,80,0.08) 0%, transparent 40%),
        repeating-linear-gradient(115deg,
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.008) 3px, rgba(255,255,255,0.008) 4px),
        repeating-linear-gradient(25deg,
          transparent 0px, transparent 3px,
          rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 5px),
        linear-gradient(135deg,
          rgba(255,255,255,0.12) 0%, rgba(200,220,240,0.06) 20%,
          rgba(120,140,160,0.03) 40%, rgba(255,255,255,0.1) 55%,
          rgba(180,200,220,0.05) 75%, rgba(255,255,255,0.08) 100%),
        linear-gradient(180deg,
          #1c1c24 0%, #2a2a3a 25%, #1a1a24 50%, #25253a 75%, #1c1c24 100%);
      border-radius: 4px 8px 8px 4px;
      box-shadow:
        inset 0 0 100px rgba(0,0,0,0.6),
        inset 6px 0 16px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    .book-front::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg,
        transparent 30%, rgba(255,255,255,0.12) 45%,
        rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.12) 55%,
        transparent 70%);
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    /* Double gold rule border */
    .book-front::after {
      content: '';
      position: absolute;
      top: 16px; left: 16px; right: 16px; bottom: 16px;
      border: 3px solid #8b6f3d;
      border-radius: 3px;
      box-shadow:
        inset 0 0 12px rgba(139,111,61,0.5),
        0 0 10px rgba(139,111,61,0.35),
        inset 0 0 0 6px rgba(139,111,61,0.15),
        inset 0 0 0 7px rgba(212,182,112,0.3);
      pointer-events: none;
    }

    /* ===== METAL CORNER TIPS ===== */
    .metal-corner {
      position: absolute;
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg,
        #d4b670 0%, #8b6f3d 30%, #d4b670 50%, #6a5428 70%, #d4b670 100%);
      box-shadow:
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 0 6px rgba(255,255,255,0.3);
      z-index: 10;
      pointer-events: none;
    }

    .metal-corner.tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
    .metal-corner.tr { top: 0; right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
    .metal-corner.bl { bottom: 0; left: 0; clip-path: polygon(0 0, 0 100%, 100% 100%); }
    .metal-corner.br { bottom: 0; right: 0; clip-path: polygon(0 100%, 100% 0, 100% 100%); }

    /* ===== VOL 1 LABEL ===== */
    .vol-label {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      color: #d4b670;
      font-family: 'Georgia', serif;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-variant: small-caps;
      text-shadow:
        0 0 6px rgba(212,182,112,0.6),
        0 1px 2px rgba(0,0,0,0.9);
      z-index: 3;
    }

    /* ===== TITLE ===== */
    .book-title {
      position: absolute;
      top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
      z-index: 2;
    }

    .book-title h1 {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #c9b88a;
      text-shadow:
        0 0 20px rgba(201,184,138,0.5),
        0 2px 4px rgba(0,0,0,0.9),
        0 0 40px rgba(201,184,138,0.3);
      line-height: 1.6;
      font-variant: small-caps;
    }

    .open-prompt {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #c9b88a;
      text-transform: uppercase;
      opacity: 0.7;
      animation: pulse 2.5s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ===== CAST SHADOW ===== */
    .book-shadow {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%) rotateX(75deg);
      width: 460px;
      height: 90px;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 40%, transparent 75%);
      filter: blur(12px);
      z-index: -1;
      pointer-events: none;
    }

    .footer {
      text-align: center;
      max-width: 600px;
      margin-top: 3rem;
    }

    .footer .name {
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: #f5e6d3;
      margin-bottom: 0.75rem;
      font-variant: small-caps;
    }

    .footer .tagline {
      font-size: 1rem;
      color: #e0cfa8;
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .footer .tagline strong { font-weight: 600; }

    .footer .footnote {
      font-size: 0.75rem;
      color: #8b7a63;
      line-height: 1.6;
      font-style: italic;
      max-width: 520px;
      margin: 0 auto;
    }

    .footer .footnote sup { color: #c9b88a; font-size: 0.7rem; }
  </style>
</head>
<body>

  <div class="book-scene" onclick="window.location.href='/lookbook.html'">
    <div class="book">
      <div class="book-shadow"></div>
      <div class="book-spine">
        <div class="band b1"></div>
        <div class="band b2"></div>
        <div class="band b3"></div>
        <div class="band b4"></div>
        <div class="band b5"></div>
        <div class="spine-title">Evelyn Caro</div>
      </div>
      <div class="book-fore-edge"></div>
      <div class="book-top-edge"></div>
      <div class="book-bottom-edge"></div>
      <div class="book-front">
        <div class="metal-corner tl"></div>
        <div class="metal-corner tr"></div>
        <div class="metal-corner bl"></div>
        <div class="metal-corner br"></div>
        <div class="book-title">
          <h1>A Mirror of My<br>Becoming</h1>
        </div>
        <div class="vol-label">Vol. I</div>
        <div class="open-prompt">Click to open</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="name">Evelyn Caro</div>
    <div class="tagline">
      <strong>Sovereign systems, local first. No cloud dependency.</strong><sup>¹</sup>
    </div>
    <div class="footnote">
      <sup>¹</sup> Five RAG pipelines built locally. Three cloud attempts — AWS, IBM WatsonX, Google AI Studio. One lost project, rebuilt. The white papers document all.
    </div>
  </footer>

</body>
</html>
