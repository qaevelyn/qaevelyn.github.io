<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" style="max-width:100%;height:auto;">
  <rect width="640" height="400" fill="#faf6ee"/>
  <rect x="8" y="8" width="624" height="384" fill="none" stroke="#8b6f3d" stroke-width="2"/>
  <rect x="13" y="13" width="614" height="374" fill="none" stroke="#8b6f3d" stroke-width="0.75" opacity="0.55"/>
  <text x="596" y="368" text-anchor="end" font-family="Georgia, serif" font-size="150" font-weight="bold" fill="#8b6f3d" opacity="0.07">7-</text>
  <text x="320" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="2" fill="#3d2e1e">SHIP 7 &#8212; MSGVAULT ADAPTER &#8212; WHAT THE OPERATOR SEES</text>
  <text x="320" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-style="italic" fill="#8b6f3d">the embed_gen watermark is the checkpoint &#183; replace-mode &#183; curfew-aware &#183; never self-restarts</text>
  <line x1="60" y1="68" x2="580" y2="68" stroke="#8b6f3d" stroke-width="0.75" opacity="0.6"/>
  <!-- app window -->
  <rect x="175" y="82" width="290" height="272" rx="10" fill="#f3ecd9" stroke="#8b6f3d" stroke-width="2.5"/>
  <rect x="181" y="88" width="278" height="260" rx="7" fill="#fffdf6" stroke="#8b6f3d" stroke-width="1"/>
  <rect x="181" y="88" width="278" height="26" rx="7" fill="#ede3cc"/>
  <rect x="181" y="106" width="278" height="8" fill="#ede3cc"/>
  <circle cx="194" cy="101" r="5.5" fill="#8b6f3d"/>
  <circle cx="194" cy="101" r="2.2" fill="#faf6ee"/>
  <text x="206" y="104.5" font-family="Georgia, serif" font-size="9" letter-spacing="1" fill="#3d2e1e">MSGVAULT ADAPTER</text>
  <text x="452" y="104.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#8b6f3d">watermark checkpoint</text>
  <rect x="189" y="122" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="133.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">msgvault.db — native tongue</text>
  <text x="444" y="133.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">read-only</text>
  <rect x="189" y="143" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="154.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">embed_gen watermark</text>
  <text x="444" y="154.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#e8974a">row 200</text>
  <rect x="189" y="164" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="175.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">Run 2 starts at</text>
  <text x="444" y="175.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">row 201</text>
  <rect x="189" y="185" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="196.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">Rows 1–200 re-ingested</text>
  <text x="444" y="196.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">never</text>
  <rect x="189" y="206" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="217.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">Curfew hours</text>
  <text x="444" y="217.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">respected</text>
  <rect x="189" y="227" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="238.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">Self-restarts</text>
  <text x="444" y="238.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">never</text>
  <rect x="189" y="256" width="262" height="32" rx="3" fill="#eef3e6" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="320" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#3f6b3f">200 messages &#183; 23,500 chunks &#183; ~25 minutes</text>
  <text x="320" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#3f6b3f">progress lives in the data itself</text>
  <rect x="181" y="330" width="278" height="18" fill="#ede3cc"/>
  <line x1="181" y1="330" x2="459" y2="330" stroke="#8b6f3d" stroke-width="0.75"/>
  <text x="189" y="342.5" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">crash, restart, curfew, resume — never re-ingest</text>
  <text x="451" y="342.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#8b6f3d">nomic-embed-text</text>
</svg>
