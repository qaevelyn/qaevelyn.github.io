<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" style="max-width:100%;height:auto;">
  <rect width="640" height="400" fill="#faf6ee"/>
  <rect x="8" y="8" width="624" height="384" fill="none" stroke="#8b6f3d" stroke-width="2"/>
  <rect x="13" y="13" width="614" height="374" fill="none" stroke="#8b6f3d" stroke-width="0.75" opacity="0.55"/>

  <text x="320" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#8b6f3d">A MIRROR OF MY BECOMING™</text>
  <text x="320" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="2" fill="#3d2e1e">RADIOLOGY COMPANION&#8482; &#8212; WHAT THE PATIENT SEES</text>
  <text x="320" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-style="italic" fill="#8b6f3d">reference build v5 &#183; 2026-10-22 &#183; demo free, deploy paid &#183; architecture sealed &#183; review under NDA</text>
  <line x1="60" y1="68" x2="580" y2="68" stroke="#8b6f3d" stroke-width="0.75" opacity="0.6"/>

  <!-- tablet frame -->
  <rect x="200" y="84" width="240" height="252" rx="12" fill="#f3ecd9" stroke="#8b6f3d" stroke-width="2.5"/>
  <rect x="207" y="91" width="226" height="238" rx="8" fill="#fffdf6" stroke="#8b6f3d" stroke-width="1"/>

  <!-- in-app header with licensee branding strip -->
  <rect x="207" y="91" width="226" height="26" rx="8" fill="#ede3cc"/>
  <rect x="207" y="109" width="226" height="8" fill="#ede3cc"/>
  <circle cx="220" cy="104" r="7" fill="#8b6f3d"/>
  <circle cx="220" cy="104" r="3" fill="#faf6ee"/>
  <text x="232" y="107.5" font-family="Georgia, serif" font-size="9" letter-spacing="1" fill="#3d2e1e">YOUR IMAGING CENTER</text>

  <!-- language chips -->
  <rect x="213" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="222.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">EN</text>
  <rect x="235" y="124" width="19" height="13" rx="3" fill="#f0e6cf" stroke="#8b6f3d" stroke-width="1"/>
  <text x="244.5" y="133" text-anchor="middle" font-size="7.5" font-weight="bold" font-family="Georgia, serif" fill="#3d2e1e">ES</text>
  <rect x="257" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="266.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">HT</text>
  <rect x="279" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="288.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">PT</text>
  <rect x="301" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="310.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">FR</text>
  <rect x="323" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="332.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">VI</text>
  <rect x="345" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="354.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">ZH</text>
  <rect x="367" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="376.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">AR</text>
  <rect x="389" y="124" width="19" height="13" rx="3" fill="#e8dfc9" stroke="#8b6f3d" stroke-width="0.6"/>
  <text x="398.5" y="133" text-anchor="middle" font-size="7.5" font-family="Georgia, serif" fill="#3d2e1e">RU</text>
  <text x="416" y="133.5" font-size="7.5" font-style="italic" font-family="Georgia, serif" fill="#8b6f3d">+10</text>

  <!-- exam date row -->
  <rect x="213" y="143" width="12" height="12" rx="2" fill="none" stroke="#8b6f3d" stroke-width="1"/>
  <line x1="213" y1="147" x2="225" y2="147" stroke="#8b6f3d" stroke-width="1"/>
  <line x1="217" y1="141" x2="217" y2="144" stroke="#8b6f3d" stroke-width="1"/>
  <line x1="221" y1="141" x2="221" y2="144" stroke="#8b6f3d" stroke-width="1"/>
  <text x="231" y="152.5" font-family="Georgia, serif" font-size="9" fill="#3d2e1e">Exam date: October 30</text>

