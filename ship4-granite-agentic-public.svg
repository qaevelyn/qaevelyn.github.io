  <rect x="181" y="88" width="278" height="260" rx="7" fill="#fffdf6" stroke="#8b6f3d" stroke-width="1"/>
  <rect x="181" y="88" width="278" height="26" rx="7" fill="#ede3cc"/>
  <rect x="181" y="106" width="278" height="8" fill="#ede3cc"/>
  <circle cx="194" cy="101" r="5.5" fill="#8b6f3d"/>
  <circle cx="194" cy="101" r="2.2" fill="#faf6ee"/>
