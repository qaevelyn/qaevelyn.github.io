  <text x="387" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" letter-spacing="1" fill="#8b6f3d">SECOND PLATFORM</text>
  <rect x="333" y="150" width="108" height="14" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="387" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#3d2e1e">same pipeline</text>
