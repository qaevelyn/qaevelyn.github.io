  <text x="387" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#3d2e1e">same tools</text>
  <rect x="333" y="194" width="108" height="14" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="387" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#3d2e1e">same receipts</text>
  <rect x="189" y="244" width="262" height="17" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="196" y="255.5" font-family="Georgia, serif" font-size="8" fill="#3d2e1e">Architecture follows the builder, not the vendor</text>
