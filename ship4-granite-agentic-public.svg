  <text x="452" y="104.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#8b6f3d">cross-platform</text>
  <rect x="189" y="122" width="128" height="110" rx="5" fill="#f3ecd9" stroke="#8b6f3d" stroke-width="0.8"/>
  <text x="253" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" letter-spacing="1" fill="#8b6f3d">MACBOOK AIR</text>
  <rect x="199" y="144" width="108" height="14" rx="3" fill="#f6efdd" stroke="#8b6f3d" stroke-width="0.5"/>
  <text x="204" y="154" font-family="Georgia, serif" font-size="7" fill="#3d2e1e">retrieve &#8594; 4 chunks</text>
