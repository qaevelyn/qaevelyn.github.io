  <text x="189" y="342.5" font-family="Georgia, serif" font-size="7.5" fill="#3d2e1e">agency was not a feature — it was a way of thinking</text>
  <text x="451" y="342.5" text-anchor="end" font-family="Georgia, serif" font-size="7.5" fill="#8b6f3d">IBM Granite</text>
