  <text x="596" y="368" text-anchor="end" font-family="Georgia, serif" font-size="150" font-weight="bold" fill="#8b6f3d" opacity="0.07">4-</text>
  <text x="320" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="2" fill="#3d2e1e">SHIP 4 &#8212; GRANITE AGENTIC RAG, CROSS-PLATFORM &#8212; WHAT THE BUILDER SEES</text>
  <text x="320" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-style="italic" fill="#8b6f3d">retrieval plus action &#183; the same pipeline on both platforms &#183; autonomous reasoning on record</text>
  <line x1="60" y1="68" x2="580" y2="68" stroke="#8b6f3d" stroke-width="0.75" opacity="0.6"/>
  <!-- app window -->
